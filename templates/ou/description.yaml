#Every mission should have this file included.  It describes the mission for the mission list screen of the server.
format version: 1

# Category for the mission; used for sorting and filtering the mission list
Category: Standard

# Letter grade for the category; A grade categories appear at the top of the list
Category Priority: B

# Name of the mission as it appears in the mission list
Visible Mission Name: My Universe

# A short (one line) description of the mission.
Description: A procedurally generated frontier.

# Keywords are used to communicate the type of mission this is.
Keywords: standard, sandbox, roguelike
