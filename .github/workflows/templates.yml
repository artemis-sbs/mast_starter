name: templates

# Every entry in templates.json is staged the way `sbs create` lays it down, its sbslib is
# downloaded from the release it pins, and its story.mast is compiled. A template that does
# not compile is worse than no template: the author who used it has no way to tell whose
# error it is.
#
# See .github/ci_templates.py for what this does and does NOT catch.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  templates:
    # WINDOWS, and it has to be: the v1.3.0 sbslib cannot be imported on Linux at all -
    # `sbs_utils/procedural/gui/screen_shot.py` binds `ctypes.WinDLL` at module scope, so
    # merely importing the library to compile anything raises AttributeError. v1.4.0 no
    # longer does this and its branch runs on ubuntu; v1.3.0 is released and cannot be
    # changed. A per-line difference like this is exactly why the line is a branch.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/ci_templates.py
